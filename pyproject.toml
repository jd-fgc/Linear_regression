[project]
name = "ft-linear-regression"
version = "0.1.0"
description = "Project to implement a linear_regression"
readme = "README.md"
authors = [
    { name = "jd-fgc", email = "jordan@gambert.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
ft-linear-regression = "ft_linear_regression:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
